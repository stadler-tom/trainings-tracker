<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Training" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Trainings-Tracker</title>
    <script>
      // After an update the phone may keep the old page for a few minutes (cache), whose script files
      // no longer exist: the screen stays white. Then load the page once more, past the cache.
      window.addEventListener('error', function (event) {
        var tag = event.target && event.target.tagName;
        if (tag !== 'SCRIPT' && tag !== 'LINK') return;
        try {
          if (sessionStorage.getItem('tt.reloaded')) return;
          sessionStorage.setItem('tt.reloaded', '1');
        } catch (e) {
          return;
        }
        location.replace(location.pathname + '?r=' + Date.now() + location.hash);
      }, true);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
